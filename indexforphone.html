<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Учебное приложение</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f3f4f6;
        --card-bg: #ffffff;
        --text: #111827;
        --success: #10b981;
        --error: #ef4444;
      }
      body {
        font-family: 'Segoe UI', sans-serif;
        padding: 20px;
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
      }

      .page {
        width: 100%;
        margin: 0 auto;
        min-height: 80vh;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .active {
        display: flex !important;
      }

      header {
        text-align: center;
        width: 100%;
        margin-bottom: 24px;
      }
      h2 {
        margin: 0 0 16px 0;
        font-weight: 600;
        color: var(--primary);
      }
      
      .class-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        width: 100%;
      }
      .class-btn {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        font-size: 16px;
        font-weight: 500;
      }
      .class-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-color: var(--primary);
      }
      .class-btn.selected {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
      }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
        width: 100%;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        height: 130px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-color: var(--primary);
      }
      .card-number {
        font-size: 32px;
        font-weight: bold;
        color: var(--primary);
        line-height: 1;
      }
      .card-status {
        margin-top: 4px;
        font-size: 11px;
        color: #6b7280;
      }

      input, textarea {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        box-sizing: border-box;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: var(--card-bg);
        font-size: 16px;
        outline: none;
      }
      input:focus, textarea:focus {
        border-color: var(--primary);
      }
      label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
        color: #374151;
      }

      .question-block {
        margin-bottom: 25px;
        padding: 15px;
        background: #f9fafb;
        border-radius: 8px;
        border-left: 5px solid var(--primary);
        width: 100%;
      }
      .question-text {
        font-weight: 600;
        margin-bottom: 10px;
        display: block;
        font-size: 15px;
      }
      textarea.work-textarea {
        width: 100%;
        min-height: 70px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        resize: vertical;
      }
      
      /* Стили для ошибок в полях */
      .has-error textarea { border-color: var(--error); }
      .error-msg {
        color: var(--error);
        font-size: 13px;
        margin-top: 5px;
        display: none;
      }
      .has-error .error-msg { display: block; }

      .timer-container {
        width: 100%;
        max-width: 400px;
        margin: 20px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: white;
      }
      #timer-fill {
        height: 20px;
        background: var(--primary);
        width: 100%;
        transition: width 1s linear;
      }
      #timer-text {
        text-align: center;
        padding: 8px;
        font-weight: bold;
      }

      .actions {
        margin-top: 30px;
        text-align: center;
      }
      .btn-primary {
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 16px;
      }
      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .btn-back {
        padding: 10px 20px;
        background: transparent;
        color: #555;
        text-decoration: none;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }

      #result-area {
        margin-top: 30px;
        padding: 20px;
        border-radius: 8px;
        display: none;
        border: 1px solid transparent;
      }
      .result-success { background-color: #d1fae5; color: #065f46; border-color: #10b981; }
      .result-fail { background-color: #fee2e2; color: #991b1b; border-color: #ef4444; }

      #back-to-cards-btn {
        display: none;
        margin-top: 15px;
      }
      .card-red {
        border: 2px solid #ef4444;        /* красная рамка */
        background-color: #fee2e2;       /* светло-красный фон */
        color: #b91c1c;                  /* тёмно-красный текст */
      }

      .card-red .card-number,
      .card-red .card-status {
  color: inherit;                  /* чтобы текст внутри тоже был красным */
      }

      @media (max-width: 600px) {
  body {
    padding: 12px; /* Чуть меньше отступы по краям на мобильном */
  }

  .page {
    padding: 0 8px; /* Компенсируем внешние отступы body */
  }

  .class-buttons {
    grid-template-columns: 1fr; /* Кнопки классов в одну колонку */
  }

  .cards-grid {
    grid-template-columns: 1fr; /* Карточки заданий в одну колонку */
  }

  .card {
    height: auto; /* Высота карточки подстраивается под контент */
    padding: 16px 12px;
  }

  .question-block {
    padding: 12px;
    border-left: 4px solid var(--primary); /* Чуть тоньше линия слева */
  }

  .question-text {
    font-size: 14px;
  }

  textarea.work-textarea {
    min-height: 60px;
    padding: 8px;
  }

  #result-area {
    padding: 16px; /* Чуть компактнее блок результатов */
  }

  .btn-primary, .btn-back {
    width: 100%; /* Кнопки на всю ширину */
    box-sizing: border-box;
    margin-bottom: 8px;
  }

  .actions {
    margin-top: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
}

    </style>
  </head>
  <body>

    <!-- Страница 1: Выбор класса -->
    <div id="page-1" class="page active">
      <header><h2>Выберите класс</h2></header>
      <div class="class-buttons">
        <button class="class-btn" onclick="selectClass(8)">8 класс</button>
        <button class="class-btn" onclick="selectClass(9)">9 класс</button>
        <button class="class-btn" onclick="selectClass(10)">10 класс</button>
        <button class="class-btn" onclick="selectClass(11)">11 класс</button>
      </div>
    </div>

    <!-- Страница 2: Выбор темы -->
    <div id="page-2" class="page">
      <header><h2 id="topic-header">Темы</h2></header>
      <div id="topics-list" class="cards-grid"></div>
      <button class="btn-back" onclick="goBack()">← Назад</button>
    </div>

    <!-- Страница 3: Карточки заданий -->
    <div id="page-3" class="page">
      <header><h2 id="topic-header">Задания по теме</h2></header>
      <div id="cards-container" class="cards-grid"></div>
      <button class="btn-back" onclick="backToTopics()">← К темам</button>
    </div>

        <!-- Страница 4: Ввод данных перед работой -->
    <div id="page-4" class="page">
      <header><h2>Регистрация перед работой</h2></header>
      <p>Заполните данные, чтобы начать выполнение карточки.</p>

      <div style="width: 100%; max-width: 400px;">
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="student-name">Фамилия и имя ученика:</label>
          <input type="text" id="student-name" placeholder="Иванов Иван" required>
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="class-letter">Буква класса:</label>
          <input type="text" id="class-letter" placeholder="А" maxlength="2" required>
        </div>
      </div>

      <div class="actions">
        <!-- Кнопка запускает startWork() напрямую из onclick -->
        <button class="btn-primary" onclick="startWork()">Начать работу</button>
        <button class="btn-back" onclick="backFromRegistration()">← Назад к карточкам</button>
      </div>
    </div>

    <!-- Страница 5: Сама работа -->
    <div id="page-5" class="page">
      <header>
        <h2>Выполнение работы</h2>
        <div class="timer-container">
          <div id="timer-fill"></div>
          <div id="timer-text">Осталось времени: 8:00</div>
        </div>
      </header>
      
      <div id="questions-area"></div>
      
      <div class="actions">
        <p id="error-summary" style="color: var(--error); display:none; margin-bottom:10px;">Не заполнены все поля. Проверьте вопросы ниже.</p>
        <button id="submit-btn" class="btn-primary" onclick="submitWork()">Сдать работу</button>
        <button id="sync-btn" class="btn-back" onclick="syncOfflineBuffer()">🔄 Синхронизировать (офлайн‑работы)</button>
        <button id="back-from-questions" class="btn-back" style="display:none;" onclick="backFromQuestions()">← Назад к карточкам</button>
      </div>

      <!-- Блок с результатами проверки -->
      <div id="result-area"></div>
      <button id="back-to-cards-btn" class="btn-back" onclick="returnToCards()">← Назад к карточкам</button>
    </div>

    <script>
      // !!! ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (заканчивается на /exec) !!!
      const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1Srz1KUsqAOVpLIponjbLbQhYnpXtFVF7WXdSmHqgOYhTgzXbw02-5NxdbygbQQmg/exec';

     let currentClass = null;
     let selectedTopic = '';
     let timerInterval = null;
     let timeLeft = 480;

      const topics = {
        8: ['Безопасность  пешеходов и пассажиров', 'Состав и назначение Вооруженных Сил Российской Федерации. Основные образцы военной техники', 'Правила поведения в опасных и чрезвычайных ситуациях', 'Основы безопасность жизнедеятельности (ОБЖ), роль безопасности в жизни человека общества государства'],
        9: ['Правила безопасного поведения в природной среде, действия при автономном существовании', 'Пожарная безопасность в природной среде, экология, её значение для общества', 'Правила поведения в горах и на водоёмах', 'Безопасные действия при наводнении/цунами', 'Безопасные действия при урагане, смерче, грозе, при землетрясении, извержении вулкана'],
        10: ['Национальная, государственная и общественная безопасность', 'Источники  опасности в быту, профилактика и первая помощь при отравлениях', 'ПБ предупреждение травм и первая помощь'],
        11: ['Экстремизм и терроризм – как угроза развития общества', 'Правила безопасного поведения при угрозе и совершении террористического акта', 'Безопасность  в природной среде, выживание в автономных условиях', 'Природные  аварийные ситуации. Природные пожары']
      };

      // Исправленные вопросы и правильные ответы (без дублей)
      const questionsDB = {
        'Безопасность  пешеходов и пассажиров': [
          { q: 'Как называется устройство, предназначенное для перевозки по дорогам людей, грузов или оборудования, установленного на нём.', a: 'Транспортное средство' },
          { q: 'Как называется специальным образом обустроенная или приспособленная к тому полоса для перемещения транспортных средств, пассажиров и пешеходов.', a: 'Дорога' },
          { q: 'Как называется элемент, входящий в состав дороги, по которому может ездить механическая безрельсовая техника.', a: 'Проезжая  часть' },

          { q: 'Как называются линии, надписи, и другие обозначения на проезжей части автомобильной дороги.', a: 'Дорожная разметка' },

          { q: 'Как называются таблички, информирующие водителя о приближении к участку дороги, на котором участник движения подвергается какой-либо опасности.', a: 'Предупреждающие знаки' },

          { q: 'Как называется маневр транспортного средства, выполняемый с целью выезда на другую дорогу или съезда с дороги на прилегающую к ней территорию.', a: 'Поворот' },

        ],

        'Состав и назначение Вооруженных Сил Российской Федерации. Основные образцы военной техники': [

          { q: 'Как называется корабль, на котором находится старший морской начальник.', a: 'Флагман' },

// --- НАВИГАЦИЯ И СТРАНИЦЫ ---
function selectClass(cls) {
  currentClass = cls;
  document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
  const btn = Array.from(document.querySelectorAll('.class-btn')).find(b => b.innerText.startsWith(cls + ' '));
  if (btn) btn.classList.add('selected');
  setTimeout(() => {
    renderTopics();
    showPage('page-2');
  }, 300);
}

function goBack() { showPage('page-1'); }
function backToTopics() { showPage('page-2'); }
function backFromRegistration() { showPage('page-3'); }

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(pageId);
  if (page) {
    page.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// --- ТАЙМЕР ---
function startTimer(seconds) {
  timeLeft = seconds;
  const timerFill = document.getElementById('timer-fill');
  const timerText = document.getElementById('timer-text');
  if (!timerFill || !timerText) return;

  timerFill.style.width = '100%';

  if (timerInterval !== null) {
    clearInterval(timerInterval);
  }

  timerInterval = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    timerText.textContent = `Осталось времени: ${minutes}:${String(secs).padStart(2, '0')}`;

    const percent = (timeLeft / seconds) * 100;
    timerFill.style.width = percent + '%';

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      alert('Время вышло! Нажмите "Сдать работу".');
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.click();
    }
    timeLeft--;
  }, 1000);
}

// --- РЕНДЕР ТЕМ И КАРТОЧЕК ---
function renderTopics() {
  const list = document.getElementById('topics-list');
  if (!list) return;
  list.innerHTML = '';
  const tList = topics[currentClass] || [];
  tList.forEach(t => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerText = t;
    div.onclick = () => selectTopic(t);
    list.appendChild(div);
  });
}

function selectTopic(topic) {
  selectedTopic = topic;
  renderCards();
  showPage('page-3');
}

function renderCards() {
  const container = document.getElementById('cards-container');
  if (!container) return;
  container.innerHTML = '';

  const header = document.getElementById('topic-header');
  if (header) header.innerText = 'Темы: ';

  for (let i = 1; i <= 13; i++) {
    const card = document.createElement('div');
    card.className = 'card';

    if (i >= 11) {
      card.classList.add('card-red');
    }

    card.innerHTML = `
      <span class="card-number">${i}</span>
      <span class="card-status">Жми, чтобы начать</span>
    `;
    card.onclick = () => openCard(i);
    container.appendChild(card);
  }
}

// --- ОТКРЫТИЕ КАРТОЧКИ ---
function openCard(cardNum) {
  const isSpecial = (cardNum >= 11 && cardNum <= 13);
  window.pendingQuestionsCount = isSpecial ? 3 : 10;
  window.pendingTimeSeconds = isSpecial ? 180 : 480;

  // Очищаем результаты
  const resultArea = document.getElementById('result-area');
  if (resultArea) {
    resultArea.innerHTML = '';
    resultArea.style.display = 'none';
  }

  // Скрываем кнопку «← Назад к карточкам», если она была видна
  const backBtn = document.getElementById('back-to-cards-btn');
  if (backBtn) {
    backBtn.style.display = 'none';
    backBtn.disabled = true;
  }

  // Разблокируем кнопку «Сдать работу»
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Сдать работу';
  }

  showPage('page-4');
}

// --- СТАРТ РАБОТЫ ---
function startWork() {
  const name = document.getElementById('student-name')?.value.trim();
  const letter = document.getElementById('class-letter')?.value.trim();

  if (!name || !letter) {
    alert('Пожалуйста, заполните все поля (имя и буква класса).');
    return;
  }

  const qCount = window.pendingQuestionsCount || 10;
  const tSeconds = window.pendingTimeSeconds || 480;

  generateQuestions(qCount);
  startTimer(tSeconds);

  showPage('page-5');

  // Ещё раз разблокируем кнопку «Сдать работу»
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Сдать работу';
  }

  // Гарантированно скрываем кнопку «← Назад к карточкам»
  const backBtn = document.getElementById('back-to-cards-btn');
  if (backBtn) {
    backBtn.style.display = 'none';
    backBtn.disabled = true;
  }
}

// --- ГЕНЕРАЦИЯ ВОПРОСОВ ---
function generateQuestions(count) {
  const area = document.getElementById('questions-area');
  if (!area) return;
  area.innerHTML = '';

  const qList = questionsDB[selectedTopic] || [];

  if (qList.length === 0) {
    area.innerHTML = '<p style="color:red;">Нет вопросов для этой темы (проверь questionsDB).</p>';
    console.warn('Нет вопросов для темы:', selectedTopic);
    return;
  }

  const shuffled = [...qList].sort(() => Math.random() - 0.5).slice(0, count);

  shuffled.forEach((qObj, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';

    const correctArray = Array.isArray(qObj.answers) ? qObj.answers : [qObj.a];
    const dataCorrectString = JSON.stringify(correctArray);

    block.innerHTML = `
      <span class="question-text">${idx + 1}. ${qObj.q}</span>
      <textarea 
        class="work-textarea" 
        id="q-${idx}" 
        placeholder="Ваш ответ" 
        data-correct='${dataCorrectString}'
      ></textarea>
      <div class="error-msg" id="err-${idx}">Заполните поле</div>
    `;
    area.appendChild(block);
  });
}

function isAnswerCorrect(userAnswer, correct) {
  if (!userAnswer || !userAnswer.trim()) return false;
  const user = userAnswer.trim().toLowerCase().replace(/\s+/g, ' ');

  if (typeof correct === 'string') {
    return user === correct.toLowerCase().replace(/\s+/g, ' ');
  }
  if (Array.isArray(correct)) {
    return correct.some(opt => {
      if (typeof opt !== 'string') return false;
      return user === opt.trim().toLowerCase().replace(/\s+/g, ' ');
    });
  }
  return false;
}

// --- ОТПРАВКА РАБОТЫ ---
function buildFormData(payload) {
  const fd = new FormData();
  fd.append('student', payload.student || '');
  fd.append('class', payload['class'] || '');
  fd.append('topic', payload.topic || '');
  fd.append('score', payload.score || '');
  return fd;
}

function renderLocalResult(correct, total, details) {
  const resultArea = document.getElementById('result-area');
  if (!resultArea) return;

  let html = `<h3 style="margin-top:0;">Результат: ${correct} из ${total}</h3>`;

  const errors = details.filter(item => item.status === 'ошибка');

  if (errors.length > 0) {
    html += `<h4>Были ошибки:</h4><ul style="line-height:1.6;">`;
    errors.forEach(item => {
      html += `
        <li>
          <strong>${item.question}</strong><br>
          Твой ответ: «${item.student || 'пусто'}»<br>
          Правильно: ${item.correct}
        </li>
      `;
    });
    html += '</ul>';
  } else if (correct > 0) {
    html += '<p style="color:#10b981; font-weight:bold;">Ошибок нет! Отличная работа!</p>';
  }

  resultArea.innerHTML = html;
}

async function submitWork() {
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn && submitBtn.disabled) {
    return;
  }

  const textareas = document.querySelectorAll('.question-block textarea');
  let hasEmpty = false;

  textareas.forEach(ta => {
    const block = ta.closest('.question-block');
    const errorMsg = block ? block.querySelector('.error-msg') : null;

    if (!ta.value.trim()) {
      hasEmpty = true;
      if (errorMsg) {
        errorMsg.textContent = 'Заполните поле';
        errorMsg.style.display = 'block';
      }
      if (block) block.classList.add('has-error');
    } else {
      if (errorMsg) errorMsg.style.display = 'none';
      if (block) block.classList.remove('has-error');
    }
  });

  if (hasEmpty) {
    alert('Пожалуйста, заполните все поля с ответами перед сдачей работы.');
    return;
  }

  clearInterval(timerInterval);
  timerInterval = null;

  const blocks = document.querySelectorAll('.question-block');
  let correctCount = 0;
  const totalQuestions = blocks.length;
  const resultDetails = [];

  blocks.forEach(block => {
    const textarea = block.querySelector('textarea');
    const errorMsg = block.querySelector('.error-msg');

    let correctAnswers = [];
    if (textarea) {
      const correctAnswersRaw = textarea.getAttribute('data-correct') || '';
      try {
        correctAnswers = JSON.parse(correctAnswersRaw);
      } catch (e) {
        console.error('Ошибка парсинга data-correct:', e);
        correctAnswers = [];
      }
    }

    const answer = textarea ? textarea.value.trim() : '';
    const normalizedAnswer = answer.toLowerCase().replace(/\s+/g, ' ').trim();

    const isCorrect = correctAnswers.some(correct => {
      if (typeof correct !== 'string') return false;
      const normalizedCorrect = correct.toLowerCase().replace(/\s+/g, ' ').trim();
      return normalizedAnswer === normalizedCorrect;
    });

    if (!isCorrect) {
      block.classList.add('has-error');
      if (errorMsg) errorMsg.style.display = 'block';
      resultDetails.push({
        question: textarea ? textarea.parentElement.querySelector('.question-text')?.textContent : 'Неизвестный вопрос',
        student: answer,
        correct: correctAnswers.filter(c => typeof c === 'string').join(' / ') || 'Нет правильного ответа',
        status: 'ошибка'
      });
    } else {
      block.classList.remove('has-error');
      if (errorMsg) errorMsg.style.display = 'none';
      correctCount++;
      resultDetails.push({
        question: textarea ? textarea.parentElement.querySelector('.question-text')?.textContent : 'Неизвестный вопрос',
        student: answer,
        correct: null,
        status: 'верно'
      });
    }
  });

  const studentName = (document.getElementById('student-name')?.value || 'Неизвестный').trim();
  const classLetter = (document.getElementById('class-letter')?.value || '').trim();
  const className = currentClass ? currentClass + ' класс' : 'Не указан';
  const scoreString = `${correctCount}/${totalQuestions}`;

  const payload = {
    student: studentName,
    'class': `${className} ${classLetter}`.trim(),
    topic: selectedTopic || 'Тема не выбрана',
    score: scoreString
  };
  payload.details = JSON.stringify(resultDetails);

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Отправка...';
  }

  const resultArea = document.getElementById('result-area');
  if (resultArea) {
    resultArea.style.display = 'block';
    resultArea.className = correctCount === totalQuestions ? 'result-success' : 'result-fail';
  }

  renderLocalResult(correctCount, totalQuestions, resultDetails);

  try {
  const response = await fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  });
  const result = await response.json();
  if (result.status === 'ok') {
    if (resultArea) {
      resultArea.innerHTML += `<p style="margin-top:10px; font-weight:bold;">Данные успешно сохранены в таблице учителя.</p>`;
    }
  } else {
    throw new Error('Ошибка сервера');
  }
} catch (err) {
  console.error('Не удалось отправить:', err);
  saveToBuffer(payload);
  if (resultArea) {
    resultArea.innerHTML += `
      <p style="margin-top:10px; color:#777; font-size:14px;">
        Нет интернета или ошибка сети. Работа сохранена в буфер и отправится при синхронизации.
      </p>
    `;
  }
  } finally {
    // Кнопка «Сдать работу» остаётся заблокированной
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Работа сдана';
    }

    // Гарантированно показываем и включаем кнопку «Назад к карточкам»
    const backBtn = document.getElementById('back-to-cards-btn');
    if (backBtn) {
      backBtn.style.display = 'inline-block';      // точно видно
      backBtn.style.visibility = 'visible';        // на случай, если где-то стоит visibility:hidden
      backBtn.style.opacity = '1';                  // на случай opacity:0
      backBtn.disabled = false;                    // точно можно нажать
      backBtn.onclick = () => {
        // При нажатии убираем кнопку, чтобы не мешала дальше
        backBtn.style.display = 'none';
        backBtn.disabled = true;
        showPage('page-3');                       // возвращаем к карточкам
    }
  }
}
}

function saveToBuffer(payload) {
  try {
    const bufferString = localStorage.getItem('offlineWorkBuffer') || '[]';
    const buffer = JSON.parse(bufferString);

    buffer.push({
      id: Date.now(),
      payload: payload,
      timestamp: new Date().toISOString()
    });

    if (buffer.length > 50) {
      buffer.shift();
    }

    localStorage.setItem('offlineWorkBuffer', JSON.stringify(buffer));
    console.log('Работа сохранена в офлайн-буфер:', buffer.length, 'записей');
  } catch (e) {
    console.error('Не удалось сохранить в буфер:', e);
  }
}

async function syncOfflineBuffer() {
  const btn = document.getElementById('sync-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Синхронизация...';
  }

  const bufferStr = localStorage.getItem('offlineWorkBuffer');
  const buffer = bufferStr ? JSON.parse(bufferStr) : [];

  if (buffer.length === 0) {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Синхронизировать';
    }
    return;
  }

  const successIds = [];

    for (const item of buffer) {
    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: buildFormData(item.payload)
      });
      const result = await response.json();
      if (result.status === 'ok') {
        successIds.push(item.id);
      } else {
        console.warn('Сервер вернул ошибку при синхронизации:', result);
        // Прерываем цикл, если сервер явно отклонил запись
        break;
      }
    } catch (err) {
      console.warn('Не удалось отправить из буфера (сеть/ошибка):', err);
      // Прерываем при сетевой ошибке — дальше всё равно не уйдёт
      break;
    }
  }

  if (successIds.length > 0) {
    const remaining = buffer.filter(i => !successIds.includes(i.id));
    localStorage.setItem('offlineWorkBuffer', JSON.stringify(remaining));
    console.log('Синхронизировано и удалено из буфера:', successIds.length, 'записей');
  } else {
    console.log('Ничего не синхронизировано (или буфер не изменился)');
  }

  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Синхронизировать';
  }
}
